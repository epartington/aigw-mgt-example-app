[project]
name = "aigw-mgt-example-app"
version = "0.1.0"
description = "Demo portal for the Portkey / Prisma AIRS AI Gateway management and reporting APIs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "jinja2>=3.1,<4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
